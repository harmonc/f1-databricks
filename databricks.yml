# This is a Databricks asset bundle definition for f1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: f1
  uuid: 51719834-055a-42dc-aef6-ad9ae19433d5

include:
  - resources/*.yml
  - resources/*/*.yml

resources:
  apps:
    my_app:
      source_code_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/f1-app
      name: f1-app
      resources:
        - name: 'sql-warehouse'
          sql_warehouse:
            id: '68b3184b1ec5beb2'
            permission: CAN_MANAGE

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: production
    default: true
    workspace:
      host: https://dbc-f76be6ba-60fe.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-f76be6ba-60fe.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/${workspace.current_user.userName} to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
